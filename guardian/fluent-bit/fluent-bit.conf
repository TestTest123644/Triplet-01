[SERVICE]
    Flush           1
    Daemon          Off
    Log_Level       info
    HTTP_Server     Off

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224

[FILTER]
    Name              lua
    Match             *
    script            /fluent-bit/etc/rewrite.lua
    call              enrichevent

[OUTPUT]
    Name              es
    Match             *
    Host              elasticsearch
    Port              9200
    Index             guardian-logs
    HTTP_User         elastic
    HTTP_Passwd       ${ELASTICSEARCH_PASSWORD}
    Suppress_Type_Name On
    Replace_Dots      On
    Trace_Error       On
    Include_Tag_Key   Off
    Logstash_Format   Off
    Generate_ID       On
