x-wait-for-postgres: &wait-for-postgres
  depends_on:
    postgres:
      condition: service_healthy

x-logging: &default-logging
  driver: fluentd
  options:
    fluentd-address: "127.0.0.1:24224"
    fluentd-async: "true"
    tag: "{{.Name}}"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardian}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-guardian}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - shared-backend
    logging: *default-logging

  grafana-postgres-init:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/provision-grafana-reader.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardian}
      POSTGRES_DB: ${POSTGRES_DB:-guardian}
      POSTGRES_GRAFANA_USER: grafana_reader
    secrets:
      - postgres_password
      - postgres_grafana_password
    volumes:
      - ./scripts/provision-grafana-reader.sh:/scripts/provision-grafana-reader.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-backend
    logging: *default-logging

  grafana-elasticsearch-init:
    image: python:3.12-alpine
    restart: "no"
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?required}
      ELASTIC_GRAFANA_USER: grafana_reader
    secrets:
      - elastic_grafana_password
    volumes:
      - ./scripts/provision-grafana-elasticsearch-reader.py:/scripts/provision-grafana-elasticsearch-reader.py:ro
    command: ["python", "/scripts/provision-grafana-elasticsearch-reader.py"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - shared-backend
    logging: *default-logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?required}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200 >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - shared-backend
    logging: *default-logging

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:3.2
    container_name: fluent-bit
    restart: unless-stopped
    ports:
      - "127.0.0.1:24224:24224"
      - "127.0.0.1:24224:24224/udp"
    environment:
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:?required}
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/rewrite.lua:/fluent-bit/etc/rewrite.lua:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - shared-backend

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    entrypoint: ["/bin/sh", "/grafana-entrypoint.sh"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/guardian-monitoring.json
      ELASTIC_GRAFANA_USER: grafana_reader
      POSTGRES_GRAFANA_USER: grafana_reader
      POSTGRES_DB: ${POSTGRES_DB:-guardian}
    secrets:
      - postgres_grafana_password
      - elastic_grafana_password
    volumes:
      - ./grafana/entrypoint.sh:/grafana-entrypoint.sh:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
      grafana-postgres-init:
        condition: service_completed_successfully
      grafana-elasticsearch-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - shared-backend
    logging: *default-logging

networks:
  shared-backend:
    external: true

volumes:
  postgres_data:
  elasticsearch_data:
  grafana_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_grafana_password:
    file: ./secrets/postgres_grafana_password.txt
  elastic_grafana_password:
    file: ./secrets/elastic_grafana_password.txt
