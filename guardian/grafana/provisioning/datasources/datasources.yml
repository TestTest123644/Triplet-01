apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    uid: guardian-elasticsearch
    url: http://elasticsearch:9200
    basicAuth: true
    basicAuthUser: $ELASTIC_GRAFANA_USER
    isDefault: false
    editable: false
    jsonData:
      index: guardian-logs
      timeField: "@timestamp"
      esVersion: "8.0.0"
      logMessageField: message
      logLevelField: level
    secureJsonData:
      basicAuthPassword: $ELASTIC_GRAFANA_PASSWORD

  - name: PostgreSQL
    type: grafana-postgresql-datasource
    access: proxy
    uid: guardian-postgres
    url: postgres:5432
    user: $POSTGRES_GRAFANA_USER
    isDefault: true
    editable: false
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $POSTGRES_GRAFANA_PASSWORD
