services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "19092:19092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - city_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Layer 1: Digital Twin Simulation & MCP Command Server
  twin_layer:
    build:
      context: ./twin
      dockerfile: Dockerfile
    container_name: twin_layer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_TOPIC: "twin.sensors"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      RED_TEAM_HOST: "0.0.0.0"
      RED_TEAM_PORT: "8100"
      WAIT_FOR_KAFKA: "true"
      SIM_SEED: "42"
      GROUND_TRUTH_DB_PATH: "/app/data/ground_truth.db"
      RED_TEAM_TOKEN_FILE: "/app/data/red_team.token"
    volumes:
      - shared_data:/app/data
    ports:
      - "8000:8000"
    networks:
      - city_network
    restart: unless-stopped

  # Layer 1 Operations Console
  dashboard:
    build:
      context: ./twin
      dockerfile: Dockerfile
    container_name: twin_dashboard
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - twin_layer
    environment:
      GROUND_TRUTH_DB_PATH: "/app/data/ground_truth.db"
      TWIN_API_URL: "http://twin_layer:8100"
      RED_TEAM_TOKEN_FILE: "/app/data/red_team.token"
    ports:
      - "8501:8501"
    volumes:
      - shared_data:/app/data
    networks:
      - city_network
    restart: unless-stopped

  # ============================================================================
  # Partner Layer Placeholders (Layer 2: City Brain & Layer 3: Guardian)
  # Uncomment and configure when integrating with partner repositories.
  # ============================================================================
  # brain:
  #   build:
  #     context: ./brain
