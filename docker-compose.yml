  #   container_name: city_brain
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #     twin_layer:
  #       condition: service_started
  #   environment:
  #     KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  #     TWIN_MCP_URL: "http://twin_layer:8000/sse"
  #   networks:
  #     - city_network
  #   restart: unless-stopped
  #
  # guardian:
  #   build:
  #     context: ./guardian
  #     dockerfile: Dockerfile
  #   container_name: guardian_security
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #     twin_layer:
  #       condition: service_started
  #   environment:
  #     KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  #     TWIN_MCP_URL: "http://twin_layer:8000/sse"
  #   networks:
  #     - city_network
  #   restart: unless-stopped

networks:
  city_network:
    name: city_network
    driver: bridge

volumes:
  shared_data:
