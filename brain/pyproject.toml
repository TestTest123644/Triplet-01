[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "city-brain"
version = "0.1.0"
description = "City Brain P1: standalone vertical slice"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "rfc3339-validator>=0.1.4",
    "cryptography>=42",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "triplet: needs the Twin MCP endpoint (BRAIN_TWIN_MCP)",
    "kafka: needs a Kafka broker (BRAIN_KAFKA_BOOTSTRAP)",
    "twin_live: needs a live Twin (BRAIN_TWIN_MCP)",
]
