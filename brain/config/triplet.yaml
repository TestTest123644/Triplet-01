mode: triplet
logs_dir: ../../logs
policy_file: ../policy/triplet.yaml
params_file: ../params/twin-triplet07-v1.yaml
kafka:
  bootstrap: kafka-1:19094,kafka-2:19094,kafka-3:19094
  group: brain-processor
  security_protocol: SASL_PLAINTEXT
  sasl_mechanism: PLAIN
  sasl_username: brain
  acks: 1
  topics:
    readings: telemetry-ingest
    verdicts: guardian.verdicts
    events: guardian.events
twin:
  profile: twin-triplet07
  mcp_url: http://twin_layer:8000/sse
  call_timeout_s: 2
guardian:
  profile: guardian-triplet07
  optional: true
