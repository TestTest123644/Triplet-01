# T05: a valve replies ok and does nothing. The Brain must flag it once and never resend.
# T05 drives the Tier T0 bang-bang planner: one open command, and a valve that ignores it.
planner: t0
duration_s: 300
guardian_policy: trust_all
inject:
  - {at_s: 0, capability: actuator, target: z4-wl1}
expect:
  valve: z4-wl1
  verdicts: [unverified]
  no_effect_alerts: 2
  dispatches: 1
