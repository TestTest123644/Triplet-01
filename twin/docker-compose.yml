services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "19092:19092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - twin_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  twin_layer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twin_layer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}"
      KAFKA_TOPIC: "${KAFKA_TOPIC:-twin.sensors}"
      KAFKA_SECURITY_PROTOCOL: "${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}"
      KAFKA_SASL_MECHANISM: "${KAFKA_SASL_MECHANISM:-PLAIN}"
      KAFKA_USERNAME: "${KAFKA_USERNAME:-}"
      KAFKA_PASSWORD_FILE: "${KAFKA_PASSWORD_FILE:-}"
      KAFKA_SSL_CA_LOCATION: "${KAFKA_SSL_CA_LOCATION:-}"
      KAFKA_ACKS: "${KAFKA_ACKS:-all}"
      KAFKA_BROKER_ADDRESS_FAMILY: "${KAFKA_BROKER_ADDRESS_FAMILY:-any}"
      WAIT_FOR_KAFKA: "${WAIT_FOR_KAFKA:-true}"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      MCP_AUTH_TOKENS: "${MCP_AUTH_TOKENS:-}"
      MCP_AUTH_TOKENS_FILE: "${MCP_AUTH_TOKENS_FILE:-}"
      RED_TEAM_HOST: "0.0.0.0"
      RED_TEAM_PORT: "8100"
      SIM_SEED: "42"
      SIM_SPEED: "${SIM_SPEED:-1}"
      GROUND_TRUTH_DB_PATH: "/app/data/ground_truth.db"
      RED_TEAM_TOKEN_FILE: "/app/data/red_team.token"
      KEYSTORE_PATH: "/app/keys/device_keys.json"
    volumes:
      - shared_data:/app/data
      - twin_keys:/app/keys
      - ${TWIN_SECRETS_DIR:-../secrets}:/app/secrets:ro
    ports:
      - "${TWIN_MCP_HOST_PORT:-8000}:8000"  # MCP command server (JSON-RPC over HTTP/SSE)
      - "${TWIN_RED_TEAM_HOST_PORT:-8100}:8100"  # Red-team adversary REST API
    networks:
      - twin_network
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twin_dashboard
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - twin_layer
    environment:
      GROUND_TRUTH_DB_PATH: "/app/data/ground_truth.db"
      TWIN_API_URL: "http://twin_layer:8100"
      MCP_URL: "http://twin_layer:8000"
      RED_TEAM_TOKEN_FILE: "/app/data/red_team.token"
    ports:
      - "${TWIN_CONSOLE_HOST_PORT:-8501}:8501"  # Streamlit operations console
    volumes:
      - shared_data:/app/data
    networks:
      - twin_network
    restart: unless-stopped

networks:
  twin_network:
    name: ${TRIPLET_NETWORK:-city_network}
    driver: bridge
    external: ${TRIPLET_NETWORK_EXTERNAL:-false}

volumes:
  shared_data:
  twin_keys:

